<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="description" content="{{description}}">
    <link rel="canonical" href="{{origin}}/guide/">
    <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt">
    <link rel="alternate" type="text/plain" href="/llms-full.txt" title="llms-full.txt">
    {{hreflang}}
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ogSiteName}}">
    <meta property="og:locale" content="{{ogLocale}}">
    <meta property="og:title" content="{{ogTitle}}">
    <meta property="og:description" content="{{ogDescription}}">
    <meta property="og:url" content="{{ogUrl}}">
    <meta property="og:image" content="{{ogImage}}">
    {{ogImageExtras}}
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ogTitle}}">
    <meta name="twitter:description" content="{{ogDescription}}">
    <meta name="twitter:image" content="{{ogImage}}">
    <link rel="stylesheet" href="/site.css">
    <link rel="stylesheet" href="/guide.css">
    <meta name="theme-color" content="#090d0f">
    {{jsonld}}
</head>
<body class="guide-root">
    <nav class="guide-nav">
        <div class="guide-nav-inner">
            <a class="brand" href="/">
                <span class="brand-mark"><img src="/resource/app-icon-192.webp" alt="Agentmux Icon"></span>
                <span class="brand-word">Agen<span class="brand-tmux">tmux</span></span>
            </a>
            <div class="guide-nav-links">
                <a href="/">Home</a>
            </div>
        </div>
    </nav>
    <main class="shell guide-shell">
        <h1>{{title}}</h1>
        <p>{{description}}</p>
        <p>Choose your language.</p>
        <nav class="lang-cards">
        {{languageLinks}}
        </nav>
    </main>
    <script>
        (function () {
            var saved = localStorage.getItem('preferred-lang');
            var pick = saved || navigator.language || '';
            if (!pick) return;
            var links = document.querySelectorAll('.lang-cards a');
            var i, code;
            // Two passes on purpose. A single pass that accepts an exact match
            // OR a base-code match takes whichever comes first in config order,
            // so a zh-CN visitor would land on zh-TW simply because zh-TW is
            // listed earlier — even once zh-Hans exists. Exact wins first,
            // wherever it sits in the list.
            for (i = 0; i < links.length; i++) {
                if (pick === links[i].getAttribute('hreflang')) {
                    location.replace(links[i].getAttribute('href'));
                    return;
                }
            }
            var base = pick.split('-')[0];
            for (i = 0; i < links.length; i++) {
                code = links[i].getAttribute('hreflang');
                if (code.split('-')[0] === base) {
                    location.replace(links[i].getAttribute('href'));
                    return;
                }
            }
        })();
    </script>
</body>
</html>
