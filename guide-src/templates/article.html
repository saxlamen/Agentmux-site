<!DOCTYPE html>
<html lang="{{htmlLang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} — Agentmux Guide</title>
    <meta name="description" content="{{description}}">
    <link rel="canonical" href="{{canonical}}">
    {{hreflang}}
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ogTitle}}">
    <meta property="og:description" content="{{ogDescription}}">
    <meta property="og:url" content="{{ogUrl}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ogTitle}}">
    <meta name="twitter:description" content="{{ogDescription}}">
    <link rel="stylesheet" href="/site.css">
    <link rel="stylesheet" href="/guide.css">
    <meta name="theme-color" content="#090d0f">
    {{jsonld}}
</head>
<body class="guide">
    <nav class="guide-nav">
        <a class="brand" href="/"><span class="brand-word">Agen<span class="brand-tmux">tmux</span></span></a>
        <a href="/guide/{{lang}}/">{{guideHomeLabel}}</a>
        <a href="/guide/{{lang}}/troubleshooting/">{{troubleshootingLabel}}</a>
    </nav>
    <main class="shell guide-shell">
        <article class="guide-article">
            <h1>{{title}}</h1>
            {{content}}
        </article>
        {{pager}}
        <script>
            // 讀者在指南首頁選過路線的話，pager 只留那條路線的鄰居，並把標籤
            // 還原成不帶路線名的版本。同步執行，避免先閃出兩張卡再收掉一張。
            (function () {
                var nav = document.querySelector('.guide-pager');
                if (!nav) return;
                var track = null;
                try { track = localStorage.getItem('agentmux-guide-track'); } catch (e) { return; }
                if (!track) return;
                var cards = nav.querySelectorAll('a[data-tracks]');
                var keep = [];
                for (var i = 0; i < cards.length; i++) {
                    if (cards[i].getAttribute('data-tracks').split(' ').indexOf(track) !== -1) {
                        keep.push(cards[i]);
                    }
                }
                // 這篇不在讀者的路線上，或本來就沒有分岔，維持原樣。
                if (!keep.length || keep.length === cards.length) return;
                for (var j = 0; j < cards.length; j++) {
                    if (keep.indexOf(cards[j]) === -1) cards[j].parentNode.removeChild(cards[j]);
                }
                for (var k = 0; k < keep.length; k++) {
                    keep[k].firstChild.nodeValue = keep[k].getAttribute('data-label');
                }
            })();
        </script>
        <aside class="guide-cta">
            <p>{{ctaLine}}</p>
            <a class="primary-btn" href="{{appStoreUrl}}">{{ctaButton}}</a>
        </aside>
    </main>
</body>
</html>
