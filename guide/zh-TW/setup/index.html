            <h1>15 分鐘，讓你的 agent 開始整晚工作</h1>
            <p>回答三個問題，我給你一份只屬於你的步驟清單。每一步都會告訴你<strong>為什麼要做</strong>、<strong>指令是什麼</strong>、<strong>怎麼確認成功了</strong>，還有<strong>沒成功的話去哪裡看</strong>。</p>
<div id="wizard" data-wizard-lang="zh-TW" data-load-failed="載入失敗，請重新整理。">
    <noscript><p>這個安裝精靈需要 JavaScript。你也可以直接看<a href="/guide/zh-TW/troubleshooting/">疑難排解</a>頁。</p></noscript>
</div>
<script src="/guide/assets/wizard.js" defer></script>

        </article>
        <nav class="guide-pager"><a class="pager-prev" data-tracks="beginner cliuser" data-label="上一篇" href="/guide/zh-TW/why-agentmux/">上一篇<span>為什麼不是 Termius / Blink</span></a></nav>
        <script>
            // If the reader picked a track on the guide index, keep only that
            // track's neighbours and restore the plain labels. Runs
            // synchronously so both cards never flash before one is removed.
            (function () {
                var nav = document.querySelector('.guide-pager');
                if (!nav) return;
                var track = null;
                try { track = localStorage.getItem('agentmux-guide-track'); } catch (e) { return; }
                if (!track) return;
                var cards = nav.querySelectorAll('a[data-tracks]');
                var keep = [];
                for (var i = 0; i < cards.length; i++) {
                    if (cards[i].getAttribute('data-tracks').split(' ').indexOf(track) !== -1) {
                        keep.push(cards[i]);
                    }
                }
                // This article isn't on the reader's track, or there was no
                // fork to resolve. Leave the pager alone.
                if (!keep.length || keep.length === cards.length) return;
                for (var j = 0; j < cards.length; j++) {
                    if (keep.indexOf(cards[j]) === -1) cards[j].parentNode.removeChild(cards[j]);
                }
                for (var k = 0; k < keep.length; k++) {
                    keep[k].firstChild.nodeValue = keep[k].getAttribute('data-label');
                }
            })();
        </script>
